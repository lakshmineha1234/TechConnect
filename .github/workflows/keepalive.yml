name: Keep Render Alive

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
  workflow_dispatch:           # allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping TechConnect
        run: curl -s -o /dev/null -w "%{http_code}" https://techconnect-tqco.onrender.com/api/auth/me
