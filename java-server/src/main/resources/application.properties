# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Session ──────────────────────────────────────────────────────────────────
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ── Disable Spring Boot's default static-resource handler ───────────────────
# StaticController.java handles all static file serving manually
spring.web.resources.add-mappings=false

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.techconnect=INFO
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%logger{0}){cyan} - %msg%n

# ── File uploads ─────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

# ── Startup banner ───────────────────────────────────────────────────────────
spring.main.banner-mode=off
