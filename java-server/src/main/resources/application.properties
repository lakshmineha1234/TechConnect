# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Session ──────────────────────────────────────────────────────────────────
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ── Disable Spring Boot's default static-resource handler ───────────────────
# StaticController.java handles all static file serving manually
spring.web.resources.add-mappings=false

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.techconnect=INFO
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%logger{0}){cyan} - %msg%n

# ── File uploads ─────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

# ── Startup banner ───────────────────────────────────────────────────────────
spring.main.banner-mode=off

# ── Mail (password reset) ─────────────────────────────────────────────────────
# Set MAIL_USERNAME and MAIL_PASSWORD env vars before starting the server.
# Uses Gmail SMTP by default — generate an App Password at myaccount.google.com/apppasswords
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
techconnect.app-url=${APP_URL:http://localhost:8080}

# ── Database (PostgreSQL) ──────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/techconnect}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
