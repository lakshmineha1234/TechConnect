# ── Server ───────────────────────────────────────────────────────────────────
server.port=${PORT:8080}

# ── Gzip compression ─────────────────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json,text/plain,image/svg+xml
server.compression.min-response-size=1024

# ── Session ──────────────────────────────────────────────────────────────────
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# ── Disable Spring Boot's default static-resource handler ───────────────────
# StaticController.java handles all static file serving manually
spring.web.resources.add-mappings=false

# ── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=WARN
logging.level.com.techconnect=INFO
logging.pattern.console=%clr(%d{HH:mm:ss}){faint} %clr(%-5level) %clr(%logger{0}){cyan} - %msg%n

# ── File uploads ─────────────────────────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=4MB
spring.servlet.multipart.max-request-size=4MB

# ── Startup banner ───────────────────────────────────────────────────────────
spring.main.banner-mode=off

# ── Email via Resend (https://resend.com) ─────────────────────────────────────
# Set RESEND_API_KEY on Render. Get a free key at resend.com (3000 emails/month).
# Set RESEND_FROM to your verified sender, e.g. "TechConnect <no-reply@yourdomain.com>"
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM:TechConnect <onboarding@resend.dev>}

# ── Mail bean (kept to satisfy Spring Boot auto-config) ───────────────────────
spring.mail.host=smtp.resend.com
spring.mail.port=587
spring.mail.username=resend
spring.mail.password=${RESEND_API_KEY:placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
techconnect.app-url=${APP_URL:http://localhost:8080}

# ── Database (PostgreSQL) ──────────────────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/techconnect}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
