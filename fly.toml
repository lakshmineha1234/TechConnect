app = "techconnect-app"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  STATIC_DIR = "/app"
  DB_PATH    = "/data/techconnect.sqlite"

[[mounts]]
  source      = "techconnect_data"
  destination = "/data"

[http_service]
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  cpu_kind = "shared"
  cpus     = 1
  memory   = "512mb"
